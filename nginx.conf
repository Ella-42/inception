events
{
	worker_connections 1024;
}

http
{
	server
	{
		listen 80;
		listen [::]:80;
	
		server_name inception.ella-peeters.me www.inception.ella-peeters.me;
		server_tokens off;
	
		location /
		{
			return 301 https://$host$request_uri;
		}
	}

	server
	{
		listen 443 default_server ssl http2;
		listen [::]:443 ssl http2;

		server_name inception.ella-peeters.me www.inception.ella-peeters.me;
	
		ssl_certificate /etc/ssl/inception_ella-peeters_me/inception_ella-peeters_me.crt;
		ssl_certificate_key /etc/ssh/ella-peeters.me.key;
		ssl_trusted_certificate /etc/ssl/inception_ella-peeters_me/inception_ella-peeters_me.ca-bundle;
	
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;
	
		location /
		{
			root /var/www/html;
			index index.html;
		}
	}

